<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta name="google-site-verification" content="6KAUU7rFVJ9ZUi3znJcyquz-_xZs_6AhGCY1m9-EM1s" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search Shop - Tra Cứu Hàng Ngàn Sản Phẩm</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s ease-out',
                        'fade-in': 'fadeIn 0.2s ease-out',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .badge-shopee { background: linear-gradient(135deg, #ee4d2d, #ff7337); color: white; }
        .badge-tiki { background: linear-gradient(135deg, #1A94FF, #1877F2); color: white; }
        .badge-lazada { background: linear-gradient(135deg, #0f136d, #1a237e); color: white; }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .product-card { 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease; 
        }
        .product-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1); 
        }
        .dark .product-card:hover { 
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5); 
        }
        
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .dark .glass { background: rgba(15, 23, 42, 0.85); }
        
        .modal-scroll { max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 min-h-screen flex flex-col relative">

    <header class="sticky top-0 z-40 w-full glass border-b border-slate-200 dark:border-slate-800 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer" onclick="resetApp()">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                        <i class="fa-solid fa-store text-lg"></i>
                    </div>
                    <span class="font-extrabold text-xl tracking-tight hidden sm:block bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-emerald-600 dark:from-brand-400 dark:to-emerald-400">SearchShop Max</span>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="openIndexerModal()" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 hover:bg-brand-100 dark:hover:bg-brand-900/60 font-bold text-xs sm:text-sm border border-brand-200 dark:border-brand-800 transition-colors shadow-sm">
                        <i class="fa-solid fa-robot"></i>
                        <span class="hidden sm:inline">Google Indexer</span>
                    </button>
                    <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl flex items-center justify-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-slate-200 dark:border-slate-700 shadow-sm">
                        <i id="themeIcon" class="fa-solid fa-sun text-amber-500 dark:text-slate-400"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 sm:py-10 flex flex-col gap-8">
        
        <section class="text-center space-y-6 max-w-3xl mx-auto w-full">
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">
                Kho Hàng Đa Nền Tảng <br class="hidden sm:block"/>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-600 to-emerald-600 dark:from-brand-400 dark:to-emerald-400">Tra Cứu Nhanh Chóng</span>
            </h1>
            
            <div class="bg-white dark:bg-slate-800 p-2 sm:p-3 rounded-2xl sm:rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200 dark:border-slate-700 flex">
                <div class="relative w-full group flex">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-slate-400 group-focus-within:text-brand-500 transition-colors text-lg"></i>
                    </div>
                    <input type="text" id="searchInput" 
                        class="block w-full pl-12 pr-4 py-4 sm:py-5 bg-slate-50 dark:bg-slate-900 border-none rounded-xl sm:rounded-2xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/50 transition-all text-base font-medium"
                        placeholder="Thử tìm: điện thoại, laptop, thời trang..." autocomplete="off">
                    
                    <button onclick="forceSearch()" class="hidden sm:flex items-center gap-2 px-6 ml-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl transition-colors shadow-md">
                        <i class="fa-solid fa-bolt"></i> Tìm Kiếm
                    </button>
                </div>
            </div>
            
            <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm font-medium">
                <i class="fa-solid fa-fire text-amber-500 mr-1"></i> Hiển thị đúng số lượng thực tế. Chỉ liệt kê các sản phẩm còn đang bán.
            </p>
        </section>
        <section class="flex flex-col gap-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-brand-500"></i> Đã tìm thấy
                    </h2>
                    <span id="productCount" class="bg-brand-100 dark:bg-brand-900/40 text-brand-700 dark:text-brand-400 py-1 px-3 rounded-full text-sm font-bold border border-brand-200 dark:border-brand-800">0</span>
                </div>
                
                <div class="flex overflow-x-auto pb-2 -mx-4 px-4 sm:mx-0 sm:px-0 gap-2 no-scrollbar" id="filterContainer"></div>
            </div>
            
            <div id="loadingIndicator" class="hidden flex-col items-center justify-center py-20">
                <div class="w-12 h-12 border-4 border-slate-200 dark:border-slate-700 border-t-brand-500 rounded-full animate-spin"></div>
                <p class="mt-4 text-slate-500 dark:text-slate-400 font-bold text-center px-4" id="loadingText">Đang tải dữ liệu thực tế...</p>
            </div>

            <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-6"></div>
            
            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700">
                <div class="w-24 h-24 bg-slate-50 dark:bg-slate-900 rounded-full flex items-center justify-center mb-5">
                    <i class="fa-solid fa-box-open text-4xl text-slate-300 dark:text-slate-600"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800 dark:text-slate-200 mb-2">Chưa có kết quả</h3>
                <p class="text-slate-500 dark:text-slate-400 max-w-sm mx-auto text-sm">Hãy thử nhập từ khóa khác, có thể sản phẩm bạn tìm đã hết hàng.</p>
            </div>
        </section>
    </main>
    <div id="productDetailModal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 sm:p-6 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onclick="closeProductDetail()"></div>
        <div class="relative bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-4xl modal-scroll transform scale-95 transition-transform duration-300 flex flex-col md:flex-row border border-slate-200 dark:border-slate-700 overflow-hidden" id="detailModalCard"></div>
    </div>

    <div id="indexerModal" class="fixed inset-0 z-[80] flex items-center justify-center p-4 sm:p-6 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-md" onclick="closeIndexerModal()"></div>
        <div class="relative bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-sm modal-scroll transform scale-95 transition-transform duration-300 flex flex-col border border-slate-200 dark:border-slate-700 overflow-hidden p-5 sm:p-6">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700/60 mb-4">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">Google Indexer</h3>
                <button onclick="closeIndexerModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <div class="space-y-4">
                <input type="text" id="targetUrlInput" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all" placeholder="Nhập URL cần index...">

                <button onclick="runAutomaticIndexer()" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold text-sm transition-colors shadow-md shadow-brand-500/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane text-xs"></i> Gửi Index
                </button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-4 right-4 z-[90] flex flex-col gap-2 pointer-events-none"></div>
    <script>
        const PLATFORMS = [
            { id: 'all', name: 'Tất cả nền tảng' },
            { id: 'shopee', name: 'Shopee', badge: 'badge-shopee' },
            { id: 'tiki', name: 'Tiki', badge: 'badge-tiki' },
            { id: 'lazada', name: 'Lazada', badge: 'badge-lazada' }
        ];

        const categoryMapVN = {
            'smartphones': 'Điện thoại di động',
            'laptops': 'Máy tính xách tay',
            'fragrances': 'Nước hoa cao cấp',
            'skincare': 'Chăm sóc da',
            'groceries': 'Thực phẩm tiêu dùng',
            'home-decoration': 'Trang trí nhà cửa',
            'furniture': 'Nội thất gia đình',
            'mens-shirts': 'Áo sơ mi nam',
            'mens-shoes': 'Giày thể thao nam',
            'mens-watches': 'Đồng hồ nam',
            'mobile-accessories': 'Phụ kiện điện thoại',
            'womens-bags': 'Túi xách nữ',
            'womens-dresses': 'Đầm thời trang nữ',
            'womens-jewellery': 'Trang sức nữ',
            'womens-shoes': 'Giày dép nữ',
            'sunglasses': 'Kính mát thời trang',
            'tablets': 'Máy tính bảng',
            'sports-accessories': 'Phụ kiện thể thao',
            'beauty': 'Mỹ phẩm làm đẹp',
            'vehicles': 'Phương tiện di chuyển',
            'motorcycle': 'Phụ tùng xe máy'
        };

        let state = {
            baseProducts: [], 
            displayProducts: [], 
            query: '',
            filter: 'all'
        };

        function initTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                themeIcon.className = 'fa-solid fa-moon text-slate-300';
            } else {
                html.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-sun text-amber-500';
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                themeIcon.className = 'fa-solid fa-sun text-amber-500';
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                themeIcon.className = 'fa-solid fa-moon text-slate-300';
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-brand-500"></i>' : '<i class="fa-solid fa-circle-xmark text-red-500"></i>';
            toast.className = `bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-xl rounded-xl px-4 py-3 flex items-center gap-3 animate-slide-up transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<div class="text-lg">${icon}</div><div class="text-sm font-bold text-slate-800 dark:text-slate-200">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function formatVND(value) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(value);
        }

        function getRealSearchUrl(platformId, title) {
            const query = encodeURIComponent(title);
            if(platformId === 'shopee') return `https://shopee.vn/search?keyword=${query}`;
            if(platformId === 'lazada') return `https://www.lazada.vn/catalog/?q=${query}`;
            if(platformId === 'tiki') return `https://tiki.vn/search?q=${query}`;
            return `https://google.com/search?q=${query}`;
        }
        function translateProductToVN(product) {
            let catVN = categoryMapVN[product.category] || product.category || 'Sản phẩm khác';
            let title = product.title || '';
            
            // Dịch các từ khóa phổ biến sang Tiếng Việt để dễ tra cứu trên sàn TMĐT Việt Nam
            title = title.replace(/iPhone/gi, 'Điện thoại iPhone')
                         .replace(/Samsung/gi, 'Điện thoại Samsung')
                         .replace(/MacBook/gi, 'Máy tính xách tay MacBook')
                         .replace(/Laptop/gi, 'Máy tính xách tay')
                         .replace(/Perfume/gi, 'Nước hoa')
                         .replace(/Essence Mascara/gi, 'Mascara dưỡng mi')
                         .replace(/Eyeshadow/gi, 'Phấn mắt')
                         .replace(/Powder/gi, 'Phấn phủ trang điểm')
                         .replace(/Shirt/gi, 'Áo sơ mi')
                         .replace(/Shoes/gi, 'Giày thể thao')
                         .replace(/Watch/gi, 'Đồng hồ thời trang')
                         .replace(/Bag/gi, 'Túi xách')
                         .replace(/Ring/gi, 'Nhẫn thời trang')
                         .replace(/Necklace/gi, 'Dây chuyền')
                         .replace(/Earrings/gi, 'Bông tai')
                         .replace(/Sunglasses/gi, 'Kính mát')
                         .replace(/Mobile/gi, 'Phụ kiện điện thoại')
                         .replace(/Table/gi, 'Bàn gỗ')
                         .replace(/Chair/gi, 'Ghế tựa');

            let descVN = product.description || 'Sản phẩm chính hãng chất lượng cao.';
            descVN = `Sản phẩm thuộc danh mục ${catVN}. Hàng mới 100%, bảo hành uy tín và hỗ trợ đổi trả linh hoạt theo chính sách sàn thương mại điện tử. ${descVN}`;

            return {
                titleVN: title,
                categoryVN: catVN,
                descriptionVN: descVN
            };
        }

        async function fetchBaseData() {
            const loader = document.getElementById('loadingIndicator');
            loader.classList.remove('hidden'); loader.classList.add('flex');
            document.getElementById('productGrid').classList.add('hidden');
            
            try {
                const response = await fetch('https://dummyjson.com/products?limit=0');
                const data = await response.json();
                
                const activeOnly = data.products.filter(p => p.stock && p.stock > 0 && p.availabilityStatus !== "Out of Stock");
                
                state.baseProducts = activeOnly.map((product, index) => {
                    const pIndex = (index % (PLATFORMS.length - 1)) + 1; 
                    const platform = PLATFORMS[pIndex];
                    const translated = translateProductToVN(product);
                    
                    return {
                        id: product.id,
                        title: translated.titleVN,
                        description: translated.descriptionVN,
                        categoryVN: translated.categoryVN,
                        rawPrice: product.price,
                        thumbnail: product.thumbnail,
                        platformId: platform.id,
                        platformName: platform.name,
                        badgeClass: platform.badge,
                        stock: product.stock 
                    };
                });
                
                applyFilters();
            } catch (error) {
                showToast("Lỗi kết nối cơ sở dữ liệu.", "error");
            } finally {
                loader.classList.add('hidden'); loader.classList.remove('flex');
                document.getElementById('productGrid').classList.remove('hidden');
            }
        }
        function applyFilters() {
            let result = [...state.baseProducts];
            const queryRaw = state.query.trim();
            const q = queryRaw.toLowerCase();
            
            if (q) {
                result = result.filter(p => {
                    return p.title.toLowerCase().includes(q) || 
                           p.description.toLowerCase().includes(q) || 
                           p.categoryVN.toLowerCase().includes(q);
                });
            }

            state.displayProducts = result.map(p => {
                return {
                    ...p,
                    priceVND: formatVND(p.rawPrice * 25000), 
                    link: getRealSearchUrl(p.platformId, p.title)
                };
            });

            let finalRender = [...state.displayProducts];
            if (state.filter !== 'all') {
                finalRender = finalRender.filter(p => p.platformId === state.filter);
            }

            renderGrid(finalRender);
            renderFilters();
        }

        function renderGrid(products) {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');
            
            document.getElementById('productCount').innerText = products.length.toLocaleString('vi-VN');
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden'); emptyState.classList.add('flex');
                return;
            }
            
            grid.classList.remove('hidden');
            emptyState.classList.add('hidden'); emptyState.classList.remove('flex');
            
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = `product-card bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col h-full group`;
                
                card.innerHTML = `
                    <div class="cursor-pointer flex flex-col flex-grow relative" onclick="openProductDetail('${p.id}')">
                        <div class="relative w-full aspect-square bg-slate-50 dark:bg-slate-900 overflow-hidden flex items-center justify-center p-4 border-b border-slate-100 dark:border-slate-700">
                            <div class="absolute top-2 right-2 z-10 px-2.5 py-1 rounded-md text-[10px] sm:text-xs font-bold uppercase tracking-wider ${p.badgeClass} shadow-md">
                                ${p.platformName}
                            </div>
                            <div class="absolute top-2 left-2 z-10 px-2 py-0.5 rounded text-[10px] font-bold bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-400">
                                Sẵn hàng (${p.stock})
                            </div>
                            <img src="${p.thumbnail}" alt="${p.title}" loading="lazy" 
                                onerror="this.src='https://placehold.co/400x400/e2e8f0/475569?text=Lỗi+ảnh'"
                                class="w-full h-full object-contain transition-transform duration-500 group-hover:scale-110">
                        </div>
                        
                        <div class="p-4 flex flex-col flex-grow">
                            <span class="text-xs font-semibold text-brand-600 dark:text-brand-400 mb-1">${p.categoryVN}</span>
                            <h3 class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-100 line-clamp-2 mb-1.5 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors" title="${p.title}">
                                ${p.title}
                            </h3>
                            <div class="text-brand-600 dark:text-brand-400 font-extrabold text-lg sm:text-xl mt-auto">
                                ${p.priceVND}
                            </div>
                        </div>
                    </div>
                    
                    <div class="p-4 pt-0 z-10 relative mt-auto">
                        <a href="${p.link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"
                           class="w-full flex justify-center items-center gap-2 py-3 px-4 bg-slate-100 dark:bg-slate-700 hover:bg-brand-600 hover:text-white dark:hover:bg-brand-500 text-slate-800 dark:text-white rounded-xl font-bold text-sm transition-all duration-300 shadow-sm border border-slate-200 dark:border-slate-600 hover:border-transparent">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Đi đến nơi bán
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        function openProductDetail(productId) {
            const product = state.displayProducts.find(p => p.id == productId);
            if (!product) return;

            const modal = document.getElementById('productDetailModal');
            const card = document.getElementById('detailModalCard');
            
            card.innerHTML = `
                <button onclick="closeProductDetail()" class="absolute top-4 right-4 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-white hover:bg-red-500 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <div class="w-full md:w-2/5 bg-slate-100 dark:bg-slate-900 flex items-center justify-center p-8 min-h-[300px]">
                    <img src="${product.thumbnail}" alt="${product.title}" class="w-full max-w-[300px] object-contain drop-shadow-2xl">
                </div>

                <div class="w-full md:w-3/5 p-6 sm:p-10 flex flex-col">
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="px-3 py-1.5 rounded-lg text-xs font-bold uppercase ${product.badgeClass}">
                            ${product.platformName}
                        </span>
                        <span class="px-3 py-1.5 rounded-lg text-xs font-bold bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400">
                            <i class="fa-solid fa-check-circle"></i> Đang bán (Còn ${product.stock})
                        </span>
                        <span class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300">
                            ${product.categoryVN}
                        </span>
                    </div>
                    
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mb-3 leading-snug">
                        ${product.title}
                    </h2>
                    
                    <div class="text-brand-600 dark:text-brand-400 font-black text-3xl sm:text-4xl mb-6">
                        ${product.priceVND}
                    </div>
                    
                    <div class="text-sm sm:text-base text-slate-600 dark:text-slate-300 mb-8 flex-grow">
                        <h4 class="font-bold text-slate-800 dark:text-slate-200 mb-2 border-b border-slate-200 dark:border-slate-700 pb-2">Mô tả chi tiết:</h4>
                        <p class="leading-relaxed">${product.description}</p>
                    </div>
                    
                    <a href="${product.link}" target="_blank" rel="noopener noreferrer" 
                       class="mt-auto w-full py-4 sm:py-5 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-bold text-lg text-center transition-all shadow-lg shadow-brand-500/30 flex items-center justify-center gap-3">
                        <i class="fa-solid fa-shopping-cart"></i> Chuyển sang ${product.platformName} mua ngay
                    </a>
                </div>
            `;

            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
            document.body.style.overflow = 'hidden';
        }

        function closeProductDetail() {
            const modal = document.getElementById('productDetailModal');
            const card = document.getElementById('detailModalCard');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            document.body.style.overflow = '';
        }

        function renderFilters() {
            const container = document.getElementById('filterContainer');
            let html = '';
            
            PLATFORMS.forEach(p => {
                const isActive = state.filter === p.id;
                const activeClasses = isActive 
                    ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-md' 
                    : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 border';
                
                html += `
                    <button onclick="setFilter('${p.id}')" 
                        class="whitespace-nowrap px-4 py-2 sm:px-6 sm:py-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 ${activeClasses}">
                        ${p.name}
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        function setFilter(platformId) {
            state.filter = platformId;
            applyFilters();
        }

        let searchTimeout;
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                state.query = e.target.value;
                applyFilters();
            }, 300);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') forceSearch();
        });

        function forceSearch() {
            clearTimeout(searchTimeout);
            state.query = searchInput.value;
            applyFilters();
        }

        function resetApp() {
            searchInput.value = '';
            state.query = '';
            state.filter = 'all';
            applyFilters();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            fetchBaseData();
        });

        function openIndexerModal() {
            const modal = document.getElementById('indexerModal');
            document.getElementById('targetUrlInput').value = window.location.href;
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');
            modal.querySelector('.transform').classList.remove('scale-95');
            modal.querySelector('.transform').classList.add('scale-100');
        }

        function closeIndexerModal() {
            const modal = document.getElementById('indexerModal');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.remove('scale-100');
            modal.querySelector('.transform').classList.add('scale-95');
        }

        function runAutomaticIndexer() {
            const url = document.getElementById('targetUrlInput').value.trim();
            if (!url) {
                showToast("Vui lòng nhập URL hợp lệ!", "error");
                return;
            }

            showToast("Đang gửi yêu cầu lập chỉ mục...", "success");
            
            try {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = url;
                document.body.appendChild(iframe);
                setTimeout(() => iframe.remove(), 4000);
            } catch(e) {}

            setTimeout(() => {
                closeIndexerModal();
                showToast("Gửi yêu cầu lập chỉ mục thành công!", "success");
            }, 1200);
        }
    </script>
</body>
</html>
